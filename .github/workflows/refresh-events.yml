name: Refresh bowling event data

on:
  schedule:
    - cron: "0 20 * * *" # 05:00 JST daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Scrape events and export web data
        run: dotnet run --project allbowl01 -- --scrape-export web/src/data

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/src/data
          git diff --cached --quiet || git commit -m "Refresh bowling event data"
          git push
